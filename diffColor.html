<!DOCTYPE html>
<!--
  找出不同色 Odd-One-Out — 加速版（2026-10）
  變更重點（遊戲玩法、樣式、20 秒、前 10 名、文字皆未改動）：
  1. 預熱：頁面載入時（以及開局時若距上次連線 > 4 分鐘）在背景 GET 一次 API，
     喚醒 Apps Script 並快取排行榜；離線或 file:// 失敗時靜默忽略。
  2. 樂觀更新：按「儲存紀錄」後立刻把分數依相同排序規則插入排行榜並標示「儲存中…」，
     防止重複送出，POST 在背景進行；成功後換成伺服器的排行榜並顯示「已儲存」，
     失敗則顯示「儲存失敗，重試」按鈕並保留本機那一列（標示未儲存）。
  3. 排行榜快取在 localStorage，結束畫面先秒顯示快取、再背景更新。
  4. POST 附帶 cid（同一局同名重送用同一個），搭配新版 Code.gs 可避免重複寫入；舊版後端會忽略它。
  個人最佳／localStorage／GA 事件 save_score 行為維持不變。
-->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odd-One-Out</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #151a22;
      --text: #e6e8eb;
      --muted: #9aa3ad;
      --accent: #59c4ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", Helvetica, Arial;
      min-height: 100dvh;
      overflow: hidden;                 /* 不捲動 */
      display: grid;
      grid-template-rows: 1fr;
      padding: 0 env(safe-area-inset-right) calc(64px + env(safe-area-inset-bottom)) env(safe-area-inset-left); /* 預留底部 HUD 空間 */
    }

    /* ====== 底部 HUD（不遮住棋盤） ====== */
    .hud {
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      z-index: 10;
      backdrop-filter: blur(6px);
      background: #0b1220b3;
      padding: 8px 12px; border-radius: 12px; border: 1px solid #2a3446;
      box-shadow: 0 8px 30px #0007;
    }
    .badge { background:#1c2330; padding:6px 10px; border-radius:10px; border:1px solid #2a3446; }
    .accent { color: var(--accent); font-weight: 800; }

    /* ====== 主遊戲區（置中、方形） ====== */
    main { display: grid; place-items: center; padding: 0; }
    .board-wrap {
      width: min(86vmin, 860px);        /* 比原本 92vmin 再縮，避免被 HUD 碰到 */
      aspect-ratio: 1 / 1;
      display: grid; place-items: center;
    }
    .board {
      display:grid; gap:10px;
      background:#121722; padding:12px; border-radius:16px;
      width: 100%; height: 100%;
      box-shadow:0 18px 60px #0009, inset 0 0 0 1px #0006;
    }
    .cell {
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      border: 1px solid #0006;
      transition: transform .08s ease, box-shadow .08s ease, outline .08s ease;
      cursor: pointer;
      outline: none;                    /* 移除瀏覽器預設的灰色框線 */
    }
    .cell:hover { transform: translateY(-2px); box-shadow: 0 6px 16px #0008; }
    .cell:focus { outline: none; }      /* 無灰框 */
    .cell:focus-visible {               /* 只有鍵盤導覽才顯示的輕量外框 */
      box-shadow: 0 0 0 3px #ffffff33, 0 0 0 1px #ffffff55 inset;
    }

    /* ====== 全畫面蓋版（開始／結束） ====== */
    .overlay {
      position: fixed; inset: 0; z-index: 20;
      display: grid; place-items: center;
      background: radial-gradient(1200px 800px at 50% -10%, #20304a80, transparent 60%), #0f1115f2;
      padding: 24px;
    }
    .card {
      width: min(92vw, 720px);
      background: var(--panel);
      border: 1px solid #2a3446;
      border-radius: 20px;
      box-shadow: 0 30px 120px #000c;
      padding: clamp(16px, 4vw, 32px);
      text-align: center;
    }
    .card h1 { margin: 0 0 6px 0; font-size: clamp(22px, 4.8vw, 42px); }
    .card p { margin: 0 0 18px 0; color: var(--muted); font-size: clamp(14px, 2.4vw, 18px); }
    .btn {
      cursor:pointer; border:none; padding:16px 22px; border-radius:14px;
      font-weight:800; color:#0b1220; background: var(--accent);
      font-size: clamp(16px, 3.2vw, 20px);
      box-shadow: 0 10px 30px #59c4ff55, inset 0 -2px 0 #0003;
    }
    .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 20px 0; }
    .stat { background:#1b2330; border:1px solid #2a3446; border-radius:14px; padding:12px; }
    .stat .k { display:block; font-size: clamp(22px, 4vw, 36px); font-weight: 900; }
    .stat .t { color: var(--muted); font-size: 13px; }

    /* ====== 紀錄與排行榜 ====== */
    .save-row { display:flex; gap:8px; justify-content:center; margin: 0 0 14px 0; flex-wrap: wrap; }
    .save-row input {
      flex: 1 1 200px; max-width: 320px;
      padding: 12px 14px; border-radius: 12px; border: 1px solid #2a3446;
      background: #0f141c; color: var(--text); font-size: 16px;
    }
    .save-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn.sm { padding: 12px 16px; font-size: 16px; }
    .btn.ghost { background: transparent; color: var(--muted); border: 1px solid #2a3446; box-shadow: none; }
    .best-line { color: var(--text); font-weight: 700; margin: 0 0 10px 0; font-size: clamp(14px, 2.4vw, 17px); }
    .best-line .accent { font-weight: 900; }
    .board-title { font-size: 14px; color: var(--muted); margin: 6px 0 6px 0; text-align: left; }
    .rank { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 14px; }
    .rank th, .rank td { padding: 6px 8px; border-bottom: 1px solid #2a3446; text-align: center; }
    .rank th { color: var(--muted); font-weight: 600; }
    .rank td.name { text-align: left; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank tr.me td { color: var(--accent); font-weight: 800; }
    .rank-wrap { max-height: 32vh; overflow-y: auto; }
    .rank td.msg { color: var(--muted); padding: 14px 8px; }
    /* 加速版：樂觀更新列的狀態標籤 */
    .rank tr.pending td { opacity: .8; }
    .rank .tag { font-size: 12px; font-weight: 700; white-space: nowrap; }
    .rank tr.failed .tag { color: #ff8a8a; }
    .rank tr.gap td { color: var(--muted); padding: 2px 8px; border-bottom: none; }
    .muted-sm { color: var(--muted); font-size: 12px; }
    .card { max-height: calc(100dvh - 32px); overflow-y: auto; }

    /* 提示放到左上角，避免與底部 HUD 打架 */
    .hint {
      position: fixed; top: 10px; left: 10px;
      color: var(--muted); font-size: 12px; text-align: left; z-index: 9;
      padding: 4px 10px; background: #0b1220aa; border: 1px solid #2a3446; border-radius: 10px;
    }

    /* ====== 響應式微調 ====== */
    @media (max-width: 640px) {
      .board { gap:8px; padding:10px; border-radius:14px; }
      .hud { gap:8px; padding:6px 10px; }
      .badge { padding:5px 8px; }
      .board-wrap { width: min(92vmin, 720px); } /* 小螢幕允許更滿 */
    }
    @media (max-width: 400px) {
      body { font-size: 15px; }
      .board { gap:6px; padding:8px; }
      .hud { bottom: calc(8px + env(safe-area-inset-bottom)); }
    }
  </style>

  gtag('config', 'G-N8QWS5JKZD');

</head>
<body>
  <!-- 底部 HUD（不遮住棋盤） -->
  <div class="hud" aria-live="polite">
    <div class="badge">等級 <span id="level" class="accent">1</span></div>
    <div class="badge">分數 <span id="score" class="accent">0</span></div>
    <div class="badge">正確率 <span id="acc" class="accent">—</span></div>
    <div class="badge">剩餘 <span id="time" class="accent">20</span>s</div>
  </div>

  <!-- 主畫面 -->
  <main>
    <div class="board-wrap">
      <div id="board" class="board" aria-label="色塊棋盤" role="group"></div>
    </div>
  </main>

  <div class="hint">提示：方向鍵移動、Enter 選取；Esc 結束一局。</div>

  <!-- 開始蓋版 -->
  <section id="intro" class="overlay" aria-modal="true">
    <div class="card">
      <h1>找出不同色 Odd-One-Out</h1>
      <p>試試看，你的眼力好不好</p>
      <p id="intro-best" class="best-line"></p>
      <button id="start-btn" class="btn" autofocus>Start</button>
    </div>
  </section>

  <!-- 結束蓋版 -->
  <section id="gameover" class="overlay" aria-modal="true" style="display:none">
    <div class="card">
      <h1>時間到！</h1>
      <p id="comment" style="margin:0 0 6px 0;color:var(--muted);font-weight:600"></p>
      <div class="stats">
        <div class="stat"><span id="st-clears" class="k">0</span><span class="t">通過關數</span></div>
        <div class="stat"><span id="st-acc" class="k">0%</span><span class="t">正確率</span></div>
        <div class="stat"><span id="st-clicks" class="k">0/0</span><span class="t">正確／總點擊</span></div>
      </div>

      <div id="save-row" class="save-row">
        <input id="player-name" type="text" maxlength="12" placeholder="輸入你的名字" autocomplete="nickname" />
        <button id="save-btn" class="btn sm">儲存紀錄</button>
      </div>
      <p id="best-line" class="best-line"></p>

      <div class="board-title">🏆 <span id="rank-title">全體玩家歷史排名</span></div>
      <div class="rank-wrap">
        <table class="rank">
          <thead><tr><th>#</th><th style="text-align:left">名字</th><th>關數</th><th>正確率</th><th>日期</th></tr></thead>
          <tbody id="rank-body"></tbody>
        </table>
      </div>

      <button id="restart-btn" class="btn">再玩一次</button>
      <p id="store-note" class="muted-sm" style="margin-top:12px"></p>
    </div>
  </section>

  <script>
  // ====== 遊戲核心參數 ======
  const GAME_TIME = 20;           // 總秒數
  const START_GRID = 2;           // 起始 NxN
  const GRID_STEP_EVERY = 3;      // 每幾關增加一次棋盤大小
  const DELTA_START = 18;         // 起始顏色差（HSL）
  const DELTA_MIN = 3;            // 最小顏色差
  const DELTA_DECAY = .88;        // 每關遞減倍率

  // ====== 狀態 ======
  let level=1, score=0, timeLeft=GAME_TIME, timer=null;
  let gridN=START_GRID, delta=DELTA_START;
  let specialIndex=0; // 正解索引
  let focusIndex=0;   // 鍵盤導覽
  let totalClicks=0, correctClicks=0; // 點擊統計
  let lastResult=null, savedThisRound=false, lastSavedId=null;
  let roundToken=0, pendingEntry=null; // 加速版：局次代號、樂觀更新中的本機紀錄

  // ====== 雲端排行榜（Google 試算表 + Apps Script）======
  // 把部署好的「網頁應用程式網址」貼在這裡（以 /exec 結尾）
  const API_URL = 'https://script.google.com/macros/s/AKfycbwY574m1jUrXqfNjYWAcv1Sb2_qO8YKlXwe7yH0JxjgHAff_fHe-6S60c5M7j9E27Gp/exec';
  const NAME_KEY = 'oddOneOut.lastName';   // 只用來記住上次輸入的名字
  const LOCAL_KEY = 'oddOneOut.records.v1'; // 沒設定 API_URL 時的備用本機紀錄

  const TOP_CACHE_KEY = 'oddOneOut.topCache.v1'; // 加速版：快取最近一次的雲端排行榜（秒開用）
  const WARM_AFTER_MS = 4 * 60 * 1000;            // 距上次連線超過 4 分鐘就重新預熱
  const GET_TIMEOUT_MS = 20000, POST_TIMEOUT_MS = 30000;

  function sortRecords(list){
    return list.slice().sort((a,b)=> b.clears-a.clears || b.accuracy-a.accuracy || a.time-b.time);
  }
  function loadLocal(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch(e){ return []; } }

  // ====== 加速版：排行榜快取 + 預熱 ======
  let cachedTop = null, cachedCount = null, lastContact = 0, warmPromise = null, lastSaveRespAt = 0;
  try {
    const c = JSON.parse(localStorage.getItem(TOP_CACHE_KEY) || 'null');
    if (c && Array.isArray(c.top)) { cachedTop = c.top; cachedCount = c.count ?? null; }
  } catch(e){}
  function rememberTop(r){
    if (!r || !r.ok || !Array.isArray(r.top)) return;
    cachedTop = r.top; cachedCount = (typeof r.count === 'number') ? r.count : cachedCount;
    if (!r.local) {
      lastContact = Date.now();
      try { localStorage.setItem(TOP_CACHE_KEY, JSON.stringify({ top: r.top, count: cachedCount, at: Date.now() })); } catch(e){}
    }
  }
  async function fetchWithTimeout(url, opts, ms){
    const ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
    const t = ctrl ? setTimeout(()=> ctrl.abort(), ms) : null;
    try { return await fetch(url, ctrl ? { ...opts, signal: ctrl.signal } : opts); }
    finally { if (t) clearTimeout(t); }
  }

  async function fetchTop(){
    if (!API_URL) return { ok:true, top: sortRecords(loadLocal()).slice(0,20), local:true };
    const startedAt = Date.now();
    const res = await fetchWithTimeout(API_URL + '?action=top', { cache:'no-store' }, GET_TIMEOUT_MS);
    const r = await res.json();
    if (startedAt >= lastSaveRespAt) rememberTop(r); // 比最近一次儲存結果舊的 GET 不覆蓋快取
    return r;
  }
  // 背景預熱：喚醒 Apps Script 並更新快取；任何錯誤（離線、file://）都靜默忽略、不阻塞
  function warmUp(){
    if (!API_URL) return Promise.resolve(null);
    if (warmPromise) return warmPromise;
    warmPromise = fetchTop()
      .then(r => { renderIntroBest(r.top); return r; })
      .catch(() => null)
      .finally(() => { warmPromise = null; });
    return warmPromise;
  }
  function maybeWarm(){
    if (API_URL && Date.now() - lastContact > WARM_AFTER_MS) warmUp();
  }
  async function postScore(rec){
    if (!API_URL){
      const id = Date.now() + '-' + Math.random().toString(36).slice(2,6);
      const { cid, ...plain } = rec;
      const r = { id, time: Date.now(), ...plain, accuracy: rec.total ? rec.correct/rec.total : 0 };
      const list = sortRecords([...loadLocal(), r]).slice(0,100);
      localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
      const mine = list.filter(x=>x.name===rec.name);
      return { ok:true, id, rank: list.findIndex(x=>x.id===id)+1, count: list.length, best: mine[0], myCount: mine.length, top: list.slice(0,20), local:true };
    }
    // 用 text/plain 送出，避免瀏覽器的跨網域預檢（Apps Script 不支援）
    const res = await fetchWithTimeout(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(rec) }, POST_TIMEOUT_MS);
    const r = await res.json();
    if (r && r.ok){ lastSaveRespAt = Date.now(); rememberTop(r); }
    return r;
  }
  function accText(correct,total){ return total ? Math.round(correct/total*100) + '%' : '—'; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const boardEl = document.getElementById('board');
  const levelEl = document.getElementById('level');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const accEl = document.getElementById('acc');

  const introEl = document.getElementById('intro');
  const overEl = document.getElementById('gameover');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');

  const stClears = document.getElementById('st-clears');
  const stLevel  = document.getElementById('st-level');
  const stScore  = document.getElementById('st-score');

  function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function hsl(h,s,l){ return `hsl(${h} ${s}% ${l}%)`; }

  function nextRound(){
    // 每過 GRID_STEP_EVERY 關擴大棋盤
    if ((level-1) % GRID_STEP_EVERY === 0 && level>1) {
      gridN = clamp(gridN+1, 2, 9);
    }
    // 顏色差逐步縮小
    delta = clamp(Math.round(delta*DELTA_DECAY), DELTA_MIN, 200);

    // 產生基底顏色（避免太暗/太亮）
    const baseH = randInt(0, 359);
    const baseS = randInt(55, 80);
    const baseL = randInt(40, 65);

    // 決定差異方向（H 或 L）
    const varyH = Math.random() < 0.6; // 多半改色相
    const sign = Math.random() < 0.5 ? -1 : 1;
    let oddH = baseH, oddL = baseL;
    if (varyH) oddH = (baseH + sign*delta + 360) % 360; else oddL = clamp(baseL + sign* Math.round(delta*0.6), 15, 80);

    // 建立棋盤
    boardEl.style.gridTemplateColumns = `repeat(${gridN}, 1fr)`;
    boardEl.innerHTML = '';

    const total = gridN*gridN;
    specialIndex = randInt(0, total-1);

    for (let i=0;i<total;i++){
      const cell = document.createElement('button');
      cell.className = 'cell';
      cell.type = 'button';
      cell.setAttribute('aria-label', `格子 ${i+1} / ${total}`);

      const isOdd = i===specialIndex;
      const color = isOdd ? hsl(oddH, baseS, oddL) : hsl(baseH, baseS, baseL);
      cell.style.background = color;

      cell.addEventListener('click',()=> choose(i));
      cell.addEventListener('keydown', (e)=>{
        const x = i % gridN, y = Math.floor(i / gridN);
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(i); }
        if (e.key === 'ArrowRight') { e.preventDefault(); focusCell(x<gridN-1 ? i+1 : i); }
        if (e.key === 'ArrowLeft')  { e.preventDefault(); focusCell(x>0 ? i-1 : i); }
        if (e.key === 'ArrowDown')  { e.preventDefault(); focusCell(y<gridN-1 ? i+gridN : i); }
        if (e.key === 'ArrowUp')    { e.preventDefault(); focusCell(y>0 ? i-gridN : i); }
      });

      boardEl.appendChild(cell);
    }

    // ⚠️ 不再自動聚焦第一格（避免左上角出現框線）
    levelEl.textContent = level;
  }

  function focusCell(idx){
    const cells = boardEl.querySelectorAll('.cell');
    idx = clamp(idx, 0, cells.length-1);
    focusIndex = idx;
    if (cells[idx]) cells[idx].focus({preventScroll:true});
  }

  function choose(idx){
    if (!timer) return;
    const correct = idx === specialIndex;
    totalClicks++;
    if (correct) correctClicks++;
    accEl.textContent = accText(correctClicks, totalClicks);
    if (correct){
      score += Math.max(1, Math.round(6 - Math.log(level+1)));
      level++;
      scoreEl.textContent = score;
      nextRound();
    } else {
      score = Math.max(0, score-1);
      scoreEl.textContent = score;
    }
  }

  function startGame(){
    introEl.style.display = 'none';
    overEl.style.display = 'none';
    level = 1; score = 0; timeLeft = GAME_TIME; gridN = START_GRID; delta = DELTA_START;
    totalClicks = 0; correctClicks = 0; savedThisRound = false; lastSavedId = null;
    roundToken++; pendingEntry = null; saving = false;
    maybeWarm(); // 加速版：距上次連線太久就在背景喚醒後端（不阻塞開局）
    accEl.textContent = '—';
    levelEl.textContent = level; scoreEl.textContent = score; timeEl.textContent = timeLeft;
    nextRound();
    clearInterval(timer);
    timer = setInterval(()=>{
      timeLeft--; timeEl.textContent = timeLeft;
      if (timeLeft<=0){ endGame(); }
    }, 1000);
  }

  function endGame(){
    clearInterval(timer); timer=null;
    boardEl.innerHTML = '';
const clears = Math.max(0, level - 1);
stClears.textContent = clears;
    const accuracy = totalClicks ? correctClicks/totalClicks : 0;
    lastResult = { clears, accuracy, correct: correctClicks, total: totalClicks };
    document.getElementById('st-acc').textContent = accText(correctClicks, totalClicks);
    document.getElementById('st-clicks').textContent = correctClicks + '/' + totalClicks;
    overEl.style.display = 'grid';

    // 名字輸入：沒點任何格子就不給存
    const saveRow = document.getElementById('save-row');
    const nameInput = document.getElementById('player-name');
    const saveBtn = document.getElementById('save-btn');
    nameInput.value = localStorage.getItem(NAME_KEY) || '';
    nameInput.disabled = false; saveBtn.disabled = false; saveBtn.textContent = '儲存紀錄';
    saveRow.style.display = totalClicks ? 'flex' : 'none';
    document.getElementById('best-line').innerHTML = '';
    loadBoard();
    if (totalClicks) setTimeout(()=> nameInput.focus(), 50);

// 顯示評語
const commentEl = document.getElementById('comment');
let msg = '';
if (clears < 5) msg = '你要檢查一下你的眼睛，或是螢幕是不是該換新的了。';
else if (clears <= 8) msg = '眼力還不錯喔！';
else if (clears <= 10) msg = '讚喔！';
else msg = '辨色力超強！';
commentEl.textContent = msg;


  }

  let saving = false;
  // 加速版：依目前顯示的排行榜 + 本機待存紀錄，算出要顯示的清單
  function displayList(base){
    const list = (base || []).slice();
    if (pendingEntry && !list.some(r => r.id === pendingEntry.id)) list.push(pendingEntry);
    return sortRecords(list);
  }
  function renderBoardNow(isLocal){
    renderTable(displayList(cachedTop), isLocal);
  }

  async function saveResult(){
    if (!lastResult || savedThisRound || saving || !lastResult.total) return;
    const nameInput = document.getElementById('player-name');
    const btn = document.getElementById('save-btn');
    const bestLine = document.getElementById('best-line');
    const name = (nameInput.value || '').trim().slice(0,12) || '無名氏';
    localStorage.setItem(NAME_KEY, name);
    saving = true; btn.disabled = true; nameInput.disabled = true; btn.textContent = '儲存中…';
    const token = roundToken;
    const res = lastResult;

    // 樂觀更新：立刻插入排行榜（同一局同名重試沿用同一個 cid，避免後端重複寫入）
    const cid = (pendingEntry && pendingEntry.name === name && pendingEntry.cid) ||
      ('c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
    pendingEntry = {
      id: 'local-' + cid, cid, time: Date.now(), name,
      clears: res.clears, correct: res.correct, total: res.total,
      accuracy: Math.round(res.correct / res.total * 10000) / 10000,
      _state: 'pending'
    };
    renderBoardNow(!API_URL);
    bestLine.innerHTML = '<span style="color:var(--muted)">儲存中…</span>';

    try {
      const r = await postScore({ name, clears:res.clears, correct:res.correct, total:res.total, cid });
      if (!r || !r.ok) throw new Error((r && r.error) || '儲存失敗');
      if (token !== roundToken) return; // 已開新局：只更新快取，不動畫面狀態
      lastSaveRespAt = Date.now();
      pendingEntry = null;
      savedThisRound = true; lastSavedId = r.id;
      btn.textContent = '已儲存 ✓';
      renderTable(r.top, r.local, { flashSaved: true });
      renderIntroBest(r.top);
      let html = `這局排名第 <span class="accent">${r.rank}</span> 名`;
      if (r.count) html += `（共 ${r.count} 筆）`;
      html += '。';
      if (r.best){
        html += ` ${escapeHtml(name)} 的歷史最佳：<span class="accent">${r.best.clears}</span> 關、正確率 <span class="accent">${accText(r.best.correct, r.best.total)}</span>`;
        if (r.best.id === r.id && r.myCount > 1) html += '（新紀錄！🎉）';
      }
      bestLine.innerHTML = html;
      if (typeof gtag === 'function') gtag('event', 'save_score', { clears: res.clears, accuracy: Math.round(res.accuracy*100) });
    } catch(err){
      if (token !== roundToken) return;
      if (pendingEntry) pendingEntry._state = 'failed';
      renderBoardNow(!API_URL);
      btn.disabled = false; nameInput.disabled = false; btn.textContent = '儲存失敗，重試';
      bestLine.innerHTML = '<span style="color:#ff8a8a">儲存失敗，請檢查網路後再按一次。</span>';
    } finally { if (token === roundToken) saving = false; }
  }

  function renderTable(list, isLocal, opts){
    const body = document.getElementById('rank-body');
    document.getElementById('rank-title').textContent = isLocal ? '歷史高分（這台裝置）' : '全體玩家歷史排名';
    document.getElementById('store-note').textContent = isLocal
      ? '尚未設定雲端資料庫：紀錄只存在這個瀏覽器（localStorage）。'
      : '排行榜存在雲端資料庫，所有玩家看到的是同一份。';
    if (!list || !list.length){
      body.innerHTML = '<tr><td colspan="5" class="msg">還沒有紀錄，留下你的名字當第一名！</td></tr>';
      return;
    }
    const flash = opts && opts.flashSaved;
    const row = (r, rankLabel) => {
      const d = new Date(r.time);
      let date = (d.getMonth()+1) + '/' + d.getDate();
      let cls = r.id===lastSavedId ? 'me' : '';
      if (r._state === 'pending'){ cls = 'me pending'; date = '<span class="tag">儲存中…</span>'; }
      else if (r._state === 'failed'){ cls = 'me failed'; date = '<span class="tag">未儲存</span>'; }
      else if (flash && r.id===lastSavedId){ date = '<span class="tag">已儲存</span>'; }
      return `<tr class="${cls}"><td>${rankLabel}</td><td class="name">${escapeHtml(r.name)}</td><td>${r.clears}</td><td>${accText(r.correct,r.total)}</td><td>${date}</td></tr>`;
    };
    let html = list.slice(0,10).map((r,i)=> row(r, i+1)).join('');
    // 本機待存紀錄排在前 10 名以外時，另外附在表格最後讓玩家看得到
    const pi = list.findIndex(r => r._state);
    if (pi >= 10){
      const serverLen = list.length - 1;
      const exact = pi < serverLen || (cachedCount !== null && serverLen >= cachedCount);
      html += '<tr class="gap"><td colspan="5">⋯</td></tr>' + row(list[pi], exact ? pi+1 : '>' + serverLen);
    }
    body.innerHTML = html;
    if (flash) setTimeout(()=>{ // 「已儲存」短暫顯示後恢復日期
      if (savedThisRound && !pendingEntry && overEl.style.display !== 'none') renderTable(list, isLocal);
    }, 2500);
  }

  async function loadBoard(){
    const startedAt = Date.now(), token = roundToken;
    // 加速版：有快取就先秒顯示，再背景更新（這次 GET 也順便喚醒後端，讓接著的儲存更快）
    if (cachedTop && API_URL) renderBoardNow(false);
    else document.getElementById('rank-body').innerHTML = '<tr><td colspan="5" class="msg">排行榜載入中…</td></tr>';
    try {
      const r = await fetchTop();
      renderIntroBest(r.top);
      if (token !== roundToken || startedAt < lastSaveRespAt) return; // 已有更新的儲存結果，別用舊資料蓋掉
      if (r.local) renderTable(displayList(r.top), true);
      else renderBoardNow(false);
    } catch(err){
      if (token !== roundToken) return;
      if (!cachedTop) document.getElementById('rank-body').innerHTML = '<tr><td colspan="5" class="msg">排行榜暫時載入失敗（請檢查網路）。</td></tr>';
    }
  }

  function renderIntroBest(list){
    const el = document.getElementById('intro-best');
    if (!list || !list.length){ el.textContent = ''; return; }
    const top = list[0];
    el.innerHTML = `目前最高紀錄：${escapeHtml(top.name)}　<span class="accent">${top.clears}</span> 關・正確率 <span class="accent">${accText(top.correct,top.total)}</span>`;
  }

  document.getElementById('save-btn').addEventListener('click', saveResult);
  document.getElementById('player-name').addEventListener('keydown', (e)=>{
    if (e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); saveResult(); }
    else e.stopPropagation(); // 打字時不觸發全域快捷鍵
  });
  // 加速版：先用快取顯示最高紀錄，再於背景預熱（喚醒 Apps Script、更新快取）
  if (cachedTop && API_URL) renderIntroBest(cachedTop);
  if (API_URL) warmUp(); else fetchTop().then(r=> renderIntroBest(r.top)).catch(()=>{});
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState === 'visible') maybeWarm(); });

  // 事件綁定
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);

  // 鍵盤快捷：在開始或結束畫面按 Enter/Space 開始；遊戲中 Esc 結束
  window.addEventListener('keydown', (e)=>{
    const onIntro = introEl.style.display !== 'none';
    const onOver  = overEl.style.display !== 'none';
    // 焦點在按鈕／輸入框／連結上時，交給元素本身處理（避免按「儲存」時被當成重開一局）
    if (e.target && ['INPUT','BUTTON','A'].includes(e.target.tagName) && (onIntro || onOver)) return;
    if ((e.key==='Enter' || e.key===' ') && (onIntro || onOver)) { e.preventDefault(); startGame(); return; }
    if (e.key==='Escape' && timer) { e.preventDefault(); endGame(); return; }

    // 若遊戲中且尚未聚焦任何格子，按方向鍵先聚焦左上（但由於 :focus-visible，這時才會見到輕量外框）
    if (!onIntro && !onOver && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
      const anyFocused = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('cell');
      if (!anyFocused) { focusCell(0); }
    }
  });
  </script>
</body>
</html>
