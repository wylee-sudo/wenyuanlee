<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>連線對戰｜3×3／4×4</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8QWS5JKZD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N8QWS5JKZD');
  </script>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --line: #2d3a4f;
      --text: #e8eef6;
      --muted: #8b9bb4;
      --x: #5b9fff;
      --o: #ff7a9a;
      --win: #3dd68c;
      --btn: #243044;
      --radius: 16px;
      --shadow: 0 12px 40px rgba(0,0,0,.35);
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%, rgba(91,159,255,.18), transparent),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(255,122,154,.12), transparent),
        var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 28px;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: .02em;
      text-align: center;
      flex-shrink: 0;
    }
    .sub {
      margin: 0 0 12px;
      text-align: center;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.45;
      flex-shrink: 0;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .size-pick {
      display: inline-flex;
      background: #121a26;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }
    .size-pick button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: .9rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .size-pick button.active {
      background: linear-gradient(135deg, #3a6fd8, #5b9fff);
      color: #fff;
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .turn {
      font-size: 1rem;
      font-weight: 600;
    }
    .turn .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.55em;
      height: 1.55em;
      border-radius: 8px;
      margin-left: 4px;
      font-weight: 800;
    }
    .turn .mark.x { background: rgba(91,159,255,.2); color: var(--x); }
    .turn .mark.o { background: rgba(255,122,154,.2); color: var(--o); }
    .scores {
      display: flex;
      gap: 8px;
      font-size: .82rem;
      color: var(--muted);
    }
    .scores span {
      background: var(--btn);
      border-radius: 999px;
      padding: 4px 10px;
    }
    .scores .sx { color: var(--x); }
    .scores .so { color: var(--o); }

    .board-area {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
    .board {
      display: grid;
      gap: 8px;
      width: min(100%, 360px);
      aspect-ratio: 1;
      max-height: 100%;
      touch-action: manipulation;
    }
    .board.size-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
    }
    .board.size-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }
    .cell {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #121a26;
      color: var(--text);
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      padding: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.2rem, 7vw, 2.6rem);
      line-height: 1;
      font-weight: 800;
      cursor: pointer;
      transition: background .15s, border-color .15s, box-shadow .15s;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .board.size-4 .cell {
      border-radius: 10px;
      font-size: clamp(1rem, 5.5vw, 2rem);
    }
    .cell:hover:not(:disabled) {
      background: #182233;
      border-color: #3d4f6a;
    }
    .cell:active:not(:disabled) {
      background: #15202e;
    }
    .cell:disabled { cursor: default; }
    .cell.x { color: var(--x); }
    .cell.o { color: var(--o); }
    .cell.win {
      background: rgba(61,214,140,.15);
      border-color: var(--win);
      box-shadow: 0 0 0 2px rgba(61,214,140,.35);
    }

    .banner {
      margin: 0 0 10px;
      padding: 10px 12px;
      border-radius: 12px;
      text-align: center;
      font-weight: 700;
      font-size: .98rem;
      display: none;
      flex-shrink: 0;
    }
    .banner.show { display: block; }
    .banner.win-x { background: rgba(91,159,255,.18); color: var(--x); }
    .banner.win-o { background: rgba(255,122,154,.18); color: var(--o); }
    .banner.draw { background: rgba(139,155,180,.15); color: var(--muted); }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .actions button {
      flex: 1;
      appearance: none;
      border: 1px solid var(--line);
      background: var(--btn);
      color: var(--text);
      font-size: .95rem;
      font-weight: 600;
      padding: 11px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .actions button:hover {
      background: #2c3c55;
      border-color: #4a5f7d;
    }
    .actions button.primary {
      background: linear-gradient(135deg, #3a6fd8, #5b9fff);
      border-color: transparent;
      color: #fff;
    }

    footer {
      margin-top: 14px;
      text-align: center;
      font-size: .75rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    footer a {
      color: #9ec0ff;
      text-decoration: none;
    }

    /* 手機：滿版、不滑動 */
    @media (max-width: 720px) {
      html, body {
        height: 100%;
        height: 100dvh;
        max-height: 100dvh;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      .wrap {
        max-width: none;
        width: 100%;
        height: 100%;
        max-height: 100dvh;
        margin: 0;
        padding:
          max(8px, var(--safe-t))
          max(10px, var(--safe-r))
          max(8px, var(--safe-b))
          max(10px, var(--safe-l));
        overflow: hidden;
      }
      h1 { font-size: 1.15rem; margin-bottom: 2px; }
      .sub {
        font-size: .78rem;
        margin-bottom: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .panel {
        border-radius: 14px;
        padding: 10px;
        box-shadow: none;
      }
      .toolbar { margin-bottom: 8px; }
      .status { margin-bottom: 8px; }
      .board {
        width: min(100%, calc(100dvh - 250px));
        max-width: 100%;
        height: auto;
        max-height: min(100%, calc(100dvh - 250px));
      }
      footer {
        margin-top: 8px;
        font-size: .68rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .actions button { padding: 10px; font-size: .9rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>連線對戰</h1>
    <p class="sub" id="ruleText">兩人輪流點格子。先連成一直線（橫、直或斜）就獲勝。</p>

    <div class="panel">
      <div class="toolbar">
        <div class="size-pick" role="group" aria-label="棋盤大小">
          <button type="button" id="btnSize3" class="active" data-size="3">3×3</button>
          <button type="button" id="btnSize4" data-size="4">4×4</button>
        </div>
        <div class="scores">
          <span class="sx">✕ <strong id="scoreX">0</strong></span>
          <span class="so">〇 <strong id="scoreO">0</strong></span>
        </div>
      </div>

      <div class="status">
        <div class="turn" id="turnLabel">輪到 <span class="mark x">✕</span></div>
      </div>

      <div class="board-area">
        <div class="board size-3" id="board" role="grid" aria-label="棋盤"></div>
      </div>

      <div class="banner" id="banner" role="status" aria-live="polite"></div>

      <div class="actions">
        <button type="button" class="primary" id="btnNext">再一局</button>
        <button type="button" id="btnResetScore">分數歸零</button>
      </div>
    </div>

    <footer>
      <a href="https://wylee-sudo.github.io/wenyuanlee/" target="_blank" rel="noopener">Color &amp; Design Research Lab | Wen-Yuan Lee</a>
    </footer>
  </div>

  <script>
    (function () {
      const MARK = { X: '✕', O: '〇' };
      const boardEl = document.getElementById('board');
      const turnLabel = document.getElementById('turnLabel');
      const banner = document.getElementById('banner');
      const scoreXEl = document.getElementById('scoreX');
      const scoreOEl = document.getElementById('scoreO');
      const ruleText = document.getElementById('ruleText');
      const btnSize3 = document.getElementById('btnSize3');
      const btnSize4 = document.getElementById('btnSize4');

      let size = 3;
      let cells = [];
      let current = 'X';
      let locked = false;
      let score = { X: 0, O: 0 };
      let winLines = [];

      function buildWinLines(n) {
        const lines = [];
        for (let r = 0; r < n; r++) {
          const row = [];
          for (let c = 0; c < n; c++) row.push(r * n + c);
          lines.push(row);
        }
        for (let c = 0; c < n; c++) {
          const col = [];
          for (let r = 0; r < n; r++) col.push(r * n + c);
          lines.push(col);
        }
        const d1 = [];
        const d2 = [];
        for (let i = 0; i < n; i++) {
          d1.push(i * n + i);
          d2.push(i * n + (n - 1 - i));
        }
        lines.push(d1, d2);
        return lines;
      }

      function updateRule() {
        ruleText.textContent =
          '兩人輪流點格子。先在 ' + size + '×' + size +
          ' 棋盤上連成一整條線（橫、直或斜）就獲勝。';
      }

      function buildBoard() {
        winLines = buildWinLines(size);
        cells = Array(size * size).fill(null);
        boardEl.className = 'board size-' + size;
        boardEl.style.gridTemplateColumns = 'repeat(' + size + ', minmax(0, 1fr))';
        boardEl.style.gridTemplateRows = 'repeat(' + size + ', minmax(0, 1fr))';
        boardEl.innerHTML = '';
        for (let i = 0; i < size * size; i++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cell';
          btn.setAttribute('role', 'gridcell');
          btn.dataset.index = String(i);
          btn.setAttribute('aria-label', '第 ' + (i + 1) + ' 格');
          btn.addEventListener('click', onCellClick);
          boardEl.appendChild(btn);
        }
      }

      function render() {
        const buttons = boardEl.querySelectorAll('.cell');
        buttons.forEach(function (btn, i) {
          const v = cells[i];
          btn.textContent = v ? MARK[v] : '';
          btn.classList.remove('x', 'o', 'win');
          if (v === 'X') btn.classList.add('x');
          if (v === 'O') btn.classList.add('o');
          btn.disabled = locked || !!v;
        });
        if (!locked) {
          turnLabel.innerHTML =
            '輪到 <span class="mark ' + current.toLowerCase() + '">' + MARK[current] + '</span>';
        }
        scoreXEl.textContent = String(score.X);
        scoreOEl.textContent = String(score.O);
      }

      function checkWinner() {
        for (let i = 0; i < winLines.length; i++) {
          const line = winLines[i];
          const a = cells[line[0]];
          if (!a) continue;
          let ok = true;
          for (let j = 1; j < line.length; j++) {
            if (cells[line[j]] !== a) { ok = false; break; }
          }
          if (ok) return { winner: a, line: line };
        }
        if (cells.every(Boolean)) return { winner: null, line: null, draw: true };
        return null;
      }

      function showBanner(kind, text) {
        banner.className = 'banner show ' + kind;
        banner.textContent = text;
      }

      function hideBanner() {
        banner.className = 'banner';
        banner.textContent = '';
      }

      function onCellClick(e) {
        if (locked) return;
        const idx = Number(e.currentTarget.dataset.index);
        if (cells[idx]) return;

        cells[idx] = current;
        const result = checkWinner();

        if (result) {
          locked = true;
          if (result.draw) {
            turnLabel.textContent = '本局結束';
            showBanner('draw', '平手！沒有人連成一線');
          } else {
            score[result.winner] += 1;
            turnLabel.innerHTML =
              '獲勝：<span class="mark ' + result.winner.toLowerCase() + '">' +
              MARK[result.winner] + '</span>';
            showBanner(
              result.winner === 'X' ? 'win-x' : 'win-o',
              MARK[result.winner] + ' 連成一直線，獲勝！'
            );
          }
          render();
          if (result.line) {
            result.line.forEach(function (i) {
              boardEl.children[i].classList.add('win');
              boardEl.children[i].disabled = true;
            });
          }
          return;
        }

        current = current === 'X' ? 'O' : 'X';
        render();
      }

      function newRound() {
        cells = Array(size * size).fill(null);
        current = 'X';
        locked = false;
        hideBanner();
        render();
      }

      function resetScore() {
        score = { X: 0, O: 0 };
        newRound();
      }

      function setSize(next) {
        if (next !== 3 && next !== 4) return;
        size = next;
        btnSize3.classList.toggle('active', size === 3);
        btnSize4.classList.toggle('active', size === 4);
        score = { X: 0, O: 0 };
        current = 'X';
        locked = false;
        hideBanner();
        updateRule();
        buildBoard();
        render();
      }

      document.getElementById('btnNext').addEventListener('click', newRound);
      document.getElementById('btnResetScore').addEventListener('click', resetScore);
      btnSize3.addEventListener('click', function () { setSize(3); });
      btnSize4.addEventListener('click', function () { setSize(4); });

      // 防止手機拖曳造成整頁滑動
      document.addEventListener('touchmove', function (e) {
        if (e.target.closest && e.target.closest('.cell')) e.preventDefault();
      }, { passive: false });

      setSize(3);
    })();
  </script>
</body>
</html>
